name: Sync Belgian IDMS documentation

# Belgium's import system: the validation rules (VRE workbook), IDMS's own code lists and the
# message XSDs. The work is in sync-be-docs.yml; this file is the schedule and the badge.
on:
  schedule:
    - cron: '20 23 * * *'
    - cron: '20 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the content hash is unchanged'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    permissions:
      contents: write
      issues: write   # the shared workflow opens an issue when it fails
    uses: ./.github/workflows/sync-be-docs.yml
    with:
      system: idms
      force: ${{ inputs.force == true }}
