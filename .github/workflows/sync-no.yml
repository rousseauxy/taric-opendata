name: Sync Norway (Tolletaten)

on:
  schedule:
    - cron: '15 22 * * *'
    # Second daily pass, 12h offset. One window a day means a single failure loses the
    # day: an upstream outage, a maintenance window on either side, or a publish that
    # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # thanks to change detection, so the retry costs almost nothing.
    - cron: '15 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      # Tolletaten publishes stable filenames, so assets are replaced in place (as for CH).
      # Skipping files already in the release would freeze the mirror at the first run of
      # the month and turn every later run into a no-op.
      - name: Download from Tolletaten CKAN
        shell: pwsh
        run: |
          $params = @{ OutputFolder = 'downloads/no' }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true }
          scripts/sync-no.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/no/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="no-$(date -u +%Y-%m)"
          scripts/publish-assets.sh --manifest --replace \
            --title "Norway Customs Tariff ${TAG}" \
            --notes "Auto-synced from [Tolletaten open data](https://data.toll.no) (CC BY 4.0). Includes all 27 published datasets: tariff structure, duty rates, quotas, restrictions, trade agreements, country groups, exchange rates, and more." \
            "$TAG" downloads/no/*

      # Last, and only when something above failed: an issue on this repository, so the failure
      # reaches a person. See scripts/report-failure.sh.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
