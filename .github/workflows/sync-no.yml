name: Sync Norway (Tolletaten)

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Tolletaten publishes stable filenames, so assets are replaced in place (as for CH).
      # Skipping files already in the release would freeze the mirror at the first run of
      # the month and turn every later run into a no-op.
      - name: Download from Tolletaten CKAN
        shell: pwsh
        run: |
          $params = @{ OutputFolder = 'downloads/no' }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true }
          scripts/sync-no.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/no/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="no-$(date -u +%Y-%m)"

          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" \
              --title "Norway Customs Tariff ${TAG}" \
              --notes "Auto-synced from [Tolletaten open data](https://data.toll.no) (CC BY 4.0). Includes all 27 published datasets: tariff structure, duty rates, quotas, restrictions, trade agreements, country groups, exchange rates, and more."

          for f in downloads/no/*; do
            [ -f "$f" ] || continue
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done
