name: Sync EU TARIC (CIRCABC + Daily)

# TEST BED COPY. The scheduled triggers are commented out on purpose:
# github.com/rousseauxy/taric-opendata remains authoritative and still runs
# these on schedule. Running them here too would scrape every source twice
# and publish the same data from two forges. Trigger manually instead.
on:
  # schedule:
    # - cron: '20 22 * * *'
    # # Second daily pass, 12h offset. One window a day means a single failure loses the
    # # day: an upstream outage, a maintenance window on either side, or a publish that
    # # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # # thanks to change detection, so the retry costs almost nothing.
    # - cron: '20 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Get already-uploaded release assets
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="eu-$(date -u +%Y-%m)"
          assets=$(scripts/release.sh view "$TAG" --json assets --jq '[.assets[].name] | join(",")' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "Existing assets: $assets"

      # The monthly zip is rebuilt when CIRCABC has published files it does not contain — the
      # month's folder fills up over the first couple of weeks. Comparing needs the current
      # copy, so fetch it; sync-eu.ps1 deletes it again if there is nothing new, which is what
      # keeps the publish step from re-uploading identical bytes.
      - name: Fetch the release's current monthly ZIP (for content comparison)
        id: existingzip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.existing.outputs.tag }}"
          NAME="eu-taric-$(date -u +%Y-%m).zip"
          mkdir -p downloads/eu
          if scripts/release.sh download "$TAG" -p "$NAME" -D downloads/eu 2>/dev/null; then
            echo "path=downloads/eu/$NAME" >> "$GITHUB_OUTPUT"
            echo "Fetched $NAME for comparison"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No existing $NAME in the release"
          fi

      - name: Download from CIRCABC and daily portal
        shell: pwsh
        run: |
          $force = '${{ github.event.inputs.force }}' -eq 'true'
          $skipFiles = ('${{ steps.existing.outputs.assets }}' -split ',' | Where-Object { $_ -ne '' })
          $params = @{
            OutputFolder = 'downloads/eu'
            SkipFiles    = $skipFiles
            ExistingZip  = '${{ steps.existingzip.outputs.path }}'
          }
          if ($force) { $params['Force'] = $true; $params['SkipFiles'] = @() }
          scripts/sync-eu.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/eu/*.zip') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.existing.outputs.tag }}"
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          scripts/release.sh view "$TAG" 2>/dev/null || \
            scripts/release.sh create "$TAG" \
              --title "EU TARIC ${YEAR}-${MONTH}" \
              --notes "Auto-synced from [CIRCABC (DG TAXUD)](https://circabc.europa.eu/ui/group/0e5f18c2-4b2f-42e9-aed4-dfe50ae1263b/library/64db9d0f-e7c9-4084-afe9-f47e70e53c10) and the [EC DDS2 daily portal](https://ec.europa.eu/taxation_customs/dds2/taric/daily_publications.jsp?Lang=en).

          Monthly XLSX extractions (nomenclature, duties, measures, geographical areas, exchange rates, legal basis) plus daily delta ZIPs."

          EXISTING=$(scripts/release.sh view "$TAG" --json assets --jq '[.assets[].name]')
          for f in downloads/eu/*.zip; do
            name=$(basename "$f")
            # The monthly zip is the one asset that legitimately changes in place: CIRCABC keeps
            # adding language files to the month for a couple of weeks after it first appears.
            # sync-eu.ps1 only leaves it here when it rebuilt it, so reaching this branch means
            # there is genuinely new content — clobber rather than skip. The daily delta zips
            # (TARIC_*.zip) are immutable and keep the skip.
            case "$name" in eu-taric-*.zip) MONTHLY=1 ;; *) MONTHLY=0 ;; esac
            if [ "$MONTHLY" = "1" ]; then
              echo "Uploading (clobber): $name"
              scripts/release.sh upload "$TAG" "$f" --clobber
            elif echo "$EXISTING" | grep -qF "\"$name\""; then
              echo "Already uploaded: $name"
            else
              echo "Uploading: $name"
              scripts/release.sh upload "$TAG" "$f"
            fi
          done
