name: Sync Belgium (Tarbel)

on:
  schedule:
    # 23:45 UTC = 01:45 CEST / 00:45 CET — safely after minfin publishes (~00:05 CEST)
    # so the same-day delta is available. Later than the other sources by design.
    - cron: '45 23 * * *'
    # Second daily pass, 12h offset. One window a day means a single failure loses the
    # day: an upstream outage, a maintenance window on either side, or a publish that
    # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # thanks to change detection, so the retry costs almost nothing.
    - cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Get already-uploaded release assets
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="be-$(date -u +%Y-%m)"
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "Existing assets: $assets"

      - name: Download from minfin (TARBEL)
        shell: pwsh
        run: |
          $skipFiles = ('${{ steps.existing.outputs.assets }}' -split ',' | Where-Object { $_ -ne '' })
          $params = @{ OutputFolder = 'downloads/be'; SkipFiles = $skipFiles }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true; $params['SkipFiles'] = @() }
          scripts/sync-be.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/be/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="be-$(date -u +%Y-%m)"
          PREVIOUS="be-$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
          # A month that has not received its full extraction yet starts with last month's, so a
          # consumer never finds a release of deltas alone.
          scripts/publish-assets.sh --manifest \
            --title "Belgium Tarbel ${TAG}" \
            --notes "Scraped directly from the Belgian minfin [TARBEL portal](https://eservices.minfin.fgov.be/extTariffBrowser/XmlExtractions). Contains EU TARIC + Belgian national measures (BTW, RBT, accijnzen): one full extraction on the 1st of the month + daily deltas, plus XML schema docs and currency rates." \
            --full-pattern '^export-[^_]+\.zip$' --carry-full-from "$PREVIOUS" \
            "$TAG" downloads/be/*

      # Last, and only when something above failed: an issue on this repository, so the failure
      # reaches a person. See scripts/report-failure.sh.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # And when everything above succeeded: close this workflow's open failure issue, so an
      # open issue means a sync that is broken now.
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh --recovered "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
