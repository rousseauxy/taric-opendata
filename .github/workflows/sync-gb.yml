name: Sync United Kingdom (UKGT)

# TEST BED COPY. The scheduled triggers are commented out on purpose:
# github.com/rousseauxy/taric-opendata remains authoritative and still runs
# these on schedule. Running them here too would scrape every source twice
# and publish the same data from two forges. Trigger manually instead.
on:
  # schedule:
    # - cron: '10 22 * * *'
    # # Second daily pass, 12h offset. One window a day means a single failure loses the
    # # day: an upstream outage, a maintenance window on either side, or a publish that
    # # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # # thanks to change detection, so the retry costs almost nothing.
    # - cron: '10 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # How many version snapshots to retain per monthly release. The UK API mints a new
      # version id every day and every filename carries it, so without pruning a release
      # accumulates 50 new assets (~1 GB) daily and hits GitHub's 1000-asset cap mid-month.
      # Each snapshot is a full dump with complete validity history, so old dailies are
      # redundant; 2 keeps the current version plus one for diffing.
      KEEP_VERSIONS: '2'

    steps:
      - uses: actions/checkout@v4

      - name: Get already-uploaded release assets
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="gb-$(date -u +%Y-%m)"
          # Reading the id straight out of `gh api` put its 404 body into $rel: the error JSON
          # was already inside the command substitution, so `2>/dev/null || echo ""` never saw
          # what broke every run from 1 August: the month's release does not exist yet, so
          # release_id became {"message":"Not Found",...}, the prune step's `!= ''` guard passed
          # on it, and `REL="{"message":...}"` was invalid shell (exit 127). Prune then failed
          # before Publish, and Publish is the only step that creates the release — so the next
          # run 404'd identically. Self-perpetuating until someone looked.
          #
          # release.sh prints nothing when the release is absent, but keep the guard: treat
          # anything that is not a plain integer as "no release".
          rel=$(scripts/release.sh id "$TAG")
          case "$rel" in (''|*[!0-9]*) rel="" ;; esac
          assets=""
          if [ -n "$rel" ]; then
            assets=$(scripts/release.sh asset-list "$TAG" | cut -f2 | paste -sd, -)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$rel" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "Existing assets: $assets"

      - name: Download from UK Trade Tariff API
        shell: pwsh
        run: |
          $skipFiles = ('${{ steps.existing.outputs.assets }}' -split ',' | Where-Object { $_ -ne '' })
          $params = @{ OutputFolder = 'downloads/gb'; SkipFiles = $skipFiles }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true; $params['SkipFiles'] = @() }
          scripts/sync-gb.ps1 @params

      # Runs before the upload so the incoming version always fits under the 1000-asset cap.
      # Guarded on new files existing: on a no-change run nothing is uploaded, so nothing
      # should be pruned either.
      - name: Prune superseded versions
        if: steps.existing.outputs.release_id != '' && hashFiles('downloads/gb/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.existing.outputs.tag }}"
          assets=$(scripts/release.sh asset-list "$TAG")

          # Newest (KEEP_VERSIONS - 1) versions survive; the version about to be uploaded
          # takes the last slot. sort -V orders v4.0.999 before v4.0.1000.
          keep=$(printf '%s\n' "$assets" | cut -f2 \
            | sed -n 's/.*-\(v[0-9][0-9.]*\)\.csv$/\1/p' \
            | sort -uV | tail -n "$((KEEP_VERSIONS - 1))")
          echo "Retaining: ${keep:-<none>}"

          printf '%s\n' "$assets" | while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            v=$(printf '%s' "$name" | sed -n 's/.*-\(v[0-9][0-9.]*\)\.csv$/\1/p')
            if [ -n "$v" ] && ! printf '%s\n' "$keep" | grep -qxF -- "$v"; then
              echo "Pruning: $name"
              scripts/release.sh asset-delete "$TAG" "$id"
            fi
          done

      - name: Publish to release
        if: hashFiles('downloads/gb/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="gb-$(date -u +%Y-%m)"

          scripts/release.sh view "$TAG" 2>/dev/null || \
            scripts/release.sh create "$TAG" \
              --title "UK Global Tariff ${TAG}" \
              --notes "Auto-synced from the [DBT Data API](https://data.api.trade.gov.uk/v1/datasets/uk-tariff-2021-01-01). Contains all 50 UK Global Tariff tables (commodities, measures, quotas, regulations, certificates, geo areas, footnotes, and more) as CSV. Version is embedded in each filename."

          EXISTING=$(scripts/release.sh view "$TAG" --json assets --jq '[.assets[].name]')
          for f in downloads/gb/*; do
            name=$(basename "$f")
            if echo "$EXISTING" | grep -qF "\"$name\""; then
              echo "Already uploaded: $name"
            else
              echo "Uploading: $name"
              scripts/release.sh upload "$TAG" "$f"
            fi
          done
