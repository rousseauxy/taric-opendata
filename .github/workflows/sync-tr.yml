name: Sync Turkey (TGTC)

on:
  schedule:
    - cron: '40 3 * * 2'   # weekly, Tuesdays 03:40 UTC (annual data + sentinel → mostly a no-op)
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if unchanged'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install xlrd (legacy .xls reader)
        run: python -m pip install --quiet xlrd

      - name: Fetch stored version marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads/tr
          YEAR=$(date -u +%Y)
          # Both markers. Fetching only the TGTC one meant the regime sentinel was never present
          # on the runner, so the regime zip was re-downloaded and re-parsed on every run.
          gh release download "tr-$YEAR" --pattern "tr-version.txt" --dir downloads/tr 2>/dev/null || true
          gh release download "tr-$YEAR" --pattern "tr-regime-version.txt" --dir downloads/tr 2>/dev/null || true

      - name: Download + parse TGTC
        shell: pwsh
        run: |
          $params = @{ OutputFolder = 'downloads/tr' }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true }
          scripts/sync-tr.ps1 @params

      # Gated on ANY output, not on tr-nomenclature.csv.
      #
      # The nomenclature is only rewritten when the TGTC zip changes — which is roughly once a
      # year. Gating on it meant that from the first "TGTC unchanged" run onwards the whole
      # publish step was skipped, and with it tr-measures.csv, which is re-parsed on every run.
      # Proven from the 2026-08-04 log: it parsed 57,236 rows and threw them away, while the
      # release asset sat at the 60,138 rows uploaded on 15 July. The regime decree had moved
      # underneath us and no amount of change detection could have surfaced it, because nothing
      # downstream of the parse ever ran.
      - name: Publish to release
        if: hashFiles('downloads/tr/*.csv', 'downloads/tr/*.zip') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR=$(date -u +%Y)
          TAG="tr-$YEAR"
          # Every asset here is republished under a constant name. The gate is what stands between
          # an error page served as rejim.zip and the release (2026-10-06).
          scripts/publish-assets.sh --manifest --replace \
            --title "Turkish Customs Tariff (TGTC) $YEAR" \
            --notes "Auto-synced from the Turkish Ministry of Trade ([ggm.ticaret.gov.tr](https://ggm.ticaret.gov.tr)). Nomenclature of the İstatistik Pozisyonlarına Bölünmüş Türk Gümrük Tarife Cetveli: 12-digit GTİP codes, Turkish descriptions, units of measure and the base (474) duty rate (tr-nomenclature.csv), the binding Section/Chapter legal notes (tr-notes.csv), the applied duties per GTİP × country group from the Import Regime Decree annex lists (tr-measures.csv), and the GSP product-group sections those lists' country exclusions refer to (tr-gsp-sectors.csv). GTİP digits 1-8 = HS6 + EU CN, so consumers can borrow EU CN descriptions for the aligned levels." \
            "$TAG" downloads/tr/*.csv downloads/tr/*.txt downloads/tr/*.zip

      # Last, and only when something above failed: an issue on this repository, so the failure
      # reaches a person. See scripts/report-failure.sh.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # And when everything above succeeded: close this workflow's open failure issue, so an
      # open issue means a sync that is broken now.
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh --recovered "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
