name: Sync France (RITA)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # RITA publishes stable filenames, so assets are replaced in place (as for CH).
      # Skipping files already in the release would freeze the mirror at the first run of
      # the month and turn every later run into a no-op.
      - name: Download from RITA (Douane FR)
        shell: pwsh
        run: |
          $params = @{ OutputFolder = 'downloads/fr' }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true }
          scripts/sync-fr.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/fr/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fr-$(date -u +%Y-%m)"

          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" \
              --title "France RITA ${TAG}" \
              --notes "Auto-synced from [RITA (Référentiel Intégré Tarifaire Automatisé)](https://www.douane.gouv.fr/rita-encyclopedie/public/experts/telechargements/init.action). Contains EU TARIC + French national measures (TVA, droits d'accise, autres taxes nationales)."

          # -f: the chapter scratch dirs are removed on success, but a mid-run failure can
          # leave one behind and gh release upload would choke on a directory.
          for f in downloads/fr/*; do
            [ -f "$f" ] || continue
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done
