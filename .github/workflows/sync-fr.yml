name: Sync France (RITA)

# TEST BED COPY. The scheduled triggers are commented out on purpose:
# github.com/rousseauxy/taric-opendata remains authoritative and still runs
# these on schedule. Running them here too would scrape every source twice
# and publish the same data from two forges. Trigger manually instead.
on:
  # schedule:
    # - cron: '0 3 * * *'
    # # Second daily pass, 12h offset. One window a day means a single failure loses the
    # # day: an upstream outage, a maintenance window on either side, or a publish that
    # # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # # thanks to change detection, so the retry costs almost nothing.
    # - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # RITA publishes stable filenames, so assets are replaced in place (as for CH).
      # Skipping files already in the release would freeze the mirror at the first run of
      # the month and turn every later run into a no-op.
      - name: Download from RITA (Douane FR)
        shell: pwsh
        run: |
          $params = @{ OutputFolder = 'downloads/fr' }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true }
          scripts/sync-fr.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/fr/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fr-$(date -u +%Y-%m)"

          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" \
              --title "France RITA ${TAG}" \
              --notes "Auto-synced from [RITA (Référentiel Intégré Tarifaire Automatisé)](https://www.douane.gouv.fr/rita-encyclopedie/public/experts/telechargements/init.action). Contains EU TARIC + French national measures (TVA, droits d'accise, autres taxes nationales)."

          # -f: the chapter scratch dirs are removed on success, but a mid-run failure can
          # leave one behind and gh release upload would choke on a directory.
          #
          # Retried, because the upload is not reliable and the failure is not clean. On
          # 2026-08-10 15:26 the third of ten uploads returned "release not found" — seconds
          # after `gh release view` had printed that same release and two files had gone up
          # against it. With `bash -e` the loop then aborted, and the release was left holding
          # CAC and CTX from that run and eight files from the day before: a mirror split across
          # two days under one tag, which is worse than not having published at all.
          for f in downloads/fr/*; do
            [ -f "$f" ] || continue
            echo "Uploading: $(basename "$f")"
            for try in 1 2 3 4; do
              gh release upload "$TAG" "$f" --clobber && break
              if [ "$try" = 4 ]; then
                echo "::error::Upload of $(basename "$f") failed four times; the release is now" \
                     "part-updated and must not be left that way."
                exit 1
              fi
              echo "  retry $try in $((try * 5))s"
              sleep $((try * 5))
            done
          done
