name: Sync US HTS (USITC)

on:
  schedule:
    - cron: '45 22 * * *'
    # Second daily pass, 12h offset. One window a day means a single failure loses the
    # day: an upstream outage, a maintenance window on either side, or a publish that
    # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # thanks to change detection, so the retry costs almost nothing.
    - cron: '45 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Fetch stored revision marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads/us
          YEAR=$(date -u +%Y)
          gh release download "us-$YEAR" --pattern "hts-version.json" --dir downloads/us 2>/dev/null || true

      - name: Download from USITC
        shell: pwsh
        run: |
          $params = @{ OutputFolder = 'downloads/us' }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true }
          scripts/sync-us.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/us/hts-us.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR=$(date -u +%Y)
          TAG="us-$YEAR"
          VERSION=$(jq -r '.name' downloads/us/hts-version.json)
          TITLE=$(jq -r '.title' downloads/us/hts-version.json)

          scripts/publish-assets.sh --manifest --replace \
            --title "US Harmonized Tariff Schedule $YEAR" \
            --notes "Auto-synced from [USITC HTS](https://hts.usitc.gov/). Full Harmonized Tariff Schedule of the United States published by the U.S. International Trade Commission. Contains all chapters 01-99: HTS numbers, descriptions, indent levels, general/special/column-2 duty rates, units of quantity, quota quantities, and additional duties. Updated per revision (~10 revisions/year)." \
            "$TAG" downloads/us/hts-us.json downloads/us/hts-us.csv downloads/us/hts-version.json

          echo "Published $VERSION to $TAG"

      # Last, and only when something above failed: an issue on this repository, so the failure
      # reaches a person. See scripts/report-failure.sh.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # And when everything above succeeded: close this workflow's open failure issue, so an
      # open issue means a sync that is broken now.
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh --recovered "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
