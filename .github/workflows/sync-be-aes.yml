name: Sync Belgian AES documentation

# Belgium's export system: the validation rules (main and "nat rules" workbooks), the Belgian
# national XSDs and code lists. The work is in sync-be-docs.yml; this file is the schedule and the
# badge.
on:
  schedule:
    - cron: '25 23 * * *'
    - cron: '25 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the content hash is unchanged'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/sync-be-docs.yml
    with:
      system: aes
      force: ${{ inputs.force == true }}
