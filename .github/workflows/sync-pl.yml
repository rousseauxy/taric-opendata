name: Sync Poland (ISZTAR4)

# TEST BED COPY. The scheduled triggers are commented out on purpose:
# github.com/rousseauxy/taric-opendata remains authoritative and still runs
# these on schedule. Running them here too would scrape every source twice
# and publish the same data from two forges. Trigger manually instead.
on:
  # schedule:
    # - cron: '35 22 * * *'
    # # Second daily pass, 12h offset. One window a day means a single failure loses the
    # # day: an upstream outage, a maintenance window on either side, or a publish that
    # # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # # thanks to change detection, so the retry costs almost nothing.
    # - cron: '35 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Get already-uploaded release assets
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pl-$(date -u +%Y)"
          assets=$(scripts/release.sh view "$TAG" --json assets --jq '[.assets[].name] | join(",")' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "Existing assets: $assets"

      # sync-pl.ps1 decides whether to publish by comparing SHA256 against the previous run's.
      # Runners are fresh, so without fetching the sidecar there is nothing to compare and every
      # run re-uploads 220 MB — which would change the asset digest and make TaricHive rebuild
      # 1.38 M measures twice a day for no reason. 66 bytes to avoid that.
      - name: Fetch the previous SHA256 sidecar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads/pl
          scripts/release.sh download "${{ steps.existing.outputs.tag }}" \
            -p 'isztar4-base.zip.sha256' -D downloads/pl 2>/dev/null \
            && echo "Previous hash: $(cat downloads/pl/isztar4-base.zip.sha256)" \
            || echo "No previous hash — this run will publish."

      - name: Download ISZTAR4 startup file
        shell: pwsh
        run: |
          $skipFiles = ('${{ steps.existing.outputs.assets }}' -split ',' | Where-Object { $_ -ne '' })
          $params = @{ OutputFolder = 'downloads/pl'; SkipFiles = $skipFiles }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true; $params['SkipFiles'] = @() }
          scripts/sync-pl.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/pl/*.zip') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pl-$(date -u +%Y)"

          scripts/release.sh view "$TAG" 2>/dev/null || \
            scripts/release.sh create "$TAG" \
              --title "Poland ISZTAR4 ${TAG}" \
              --notes "Auto-synced from [ISZTAR4 XmlExtractions](https://ext-isztar4.mf.gov.pl/taryfa_celna/XmlExtractions). Full startup file containing all EU TARIC + Polish national tariff objects (~7.7 GB XML, ~220 MB compressed ZIP). Source: Ministry of Finance (Ministerstwo Finansów) + European Commission DG TAXUD."

          # The sidecar goes up with it, so the next run has something to compare against.
          scripts/release.sh upload "$TAG" \
            downloads/pl/isztar4-base.zip \
            downloads/pl/isztar4-base.zip.sha256 --clobber
