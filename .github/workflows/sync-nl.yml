name: Sync Netherlands (DTV)

on:
  schedule:
    - cron: '5 22 * * *'
    # Second daily pass, 12h offset. One window a day means a single failure loses the
    # day: an upstream outage, a maintenance window on either side, or a publish that
    # slips past our slot (NL lands ~5 minutes before it). An unchanged source is a no-op
    # thanks to change detection, so the retry costs almost nothing.
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download even if already in the release'
        type: boolean
        default: false
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Get already-uploaded release assets
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nl-$(date -u +%Y-%m)"
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          echo "Existing assets: $assets"

      - name: Download from Belastingdienst DTV
        shell: pwsh
        run: |
          $skipFiles = ('${{ steps.existing.outputs.assets }}' -split ',' | Where-Object { $_ -ne '' })
          $params = @{ OutputFolder = 'downloads/nl'; SkipFiles = $skipFiles }
          if ('${{ inputs.force }}' -eq 'true') { $params['Force'] = $true; $params['SkipFiles'] = @() }
          scripts/sync-nl.ps1 @params

      - name: Publish to release
        if: hashFiles('downloads/nl/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nl-$(date -u +%Y-%m)"
          TITLE="Netherlands DTV ${TAG}"
          NOTES="Auto-synced from the Dutch Douane [DTV bulk download](https://kennisbank.douane.nl/wp-content/uploads/tariff/download_bestanden.xml). Contains EU TARIC + Dutch national measures (BTW, accijns)."
          # The publisher's own listing is republished under a constant name; the dated archives are not.
          if [ -f downloads/nl/manifest.xml ]; then
            PUBLISH_ALLOW_SHRINK=1 scripts/publish-assets.sh --manifest --replace --title "$TITLE" --notes "$NOTES" "$TAG" downloads/nl/manifest.xml
          fi
          files=$(find downloads/nl -maxdepth 1 -type f ! -name manifest.xml | sort)
          [ -z "$files" ] || scripts/publish-assets.sh --manifest --title "$TITLE" --notes "$NOTES" "$TAG" $files

      # Last, and only when something above failed: an issue on this repository, so the failure
      # reaches a person. See scripts/report-failure.sh.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # And when everything above succeeded: close this workflow's open failure issue, so an
      # open issue means a sync that is broken now.
      - name: Report recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/report-failure.sh --recovered "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
